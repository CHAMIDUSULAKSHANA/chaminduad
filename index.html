<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Shop - Online Electronics Store</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <i class="fas fa-store"></i>
                <span class="shop-name">Tech Shop</span>
            </div>
            <div class="nav-right">
                <button class="nav-btn contact-btn" onclick="scrollToFooter()">
                    <i class="fas fa-phone"></i>
                </button>
                <button class="nav-btn cart-btn" onclick="toggleCart()">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Category Slider -->
    <section class="category-section">
        <div class="category-container" id="categoryContainer">
            <button class="category-btn active" data-category="all">All</button>
            <button class="category-btn" data-category="headphones">Headphones</button>
            <button class="category-btn" data-category="powerbanks">Power Banks</button>
            <button class="category-btn" data-category="chargers">Chargers</button>
            <button class="category-btn" data-category="smartwatches">Smart Watches</button>
            <button class="category-btn" data-category="speakers">Speakers</button>
            <button class="category-btn" data-category="cables">Cables</button>
            <button class="category-btn" data-category="cases">Phone Cases</button>
        </div>
    </section>

    <!-- Products Section -->
    <main class="main-content">
        <div class="products-grid" id="productsGrid">
            <!-- Products will be dynamically loaded here -->
        </div>
    </main>

    <!-- Product Modal -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">
                <i class="fas fa-times"></i>
            </button>
            <div class="modal-body">
                <div class="modal-gallery">
                    <div class="gallery-container">
                        <div class="gallery-slider" id="gallerySlider">
                            <!-- Images will be dynamically loaded here -->
                        </div>
                        <button class="gallery-nav prev" onclick="prevImage()" id="prevBtn">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <button class="gallery-nav next" onclick="nextImage()" id="nextBtn">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                    <div class="gallery-indicators" id="galleryIndicators">
                        <!-- Indicators will be dynamically loaded here -->
                    </div>
                </div>
                <div class="modal-details">
                    <h2 id="modalTitle"></h2>
                    <div class="modal-price" id="modalPrice"></div>
                    
                    <div class="variation-section">
                        <label>Color:</label>
                        <div class="variation-options" id="colorOptions"></div>
                    </div>
                    
                    <div class="variation-section">
                        <label>Quantity:</label>
                        <div class="quantity-selector">
                            <button class="qty-btn" onclick="decreaseQty()">-</button>
                            <input type="number" id="quantity" value="1" min="1" max="10">
                            <button class="qty-btn" onclick="increaseQty()">+</button>
                        </div>
                    </div>
                    
                    <button class="add-to-cart-btn" onclick="addToCart()">
                        <i class="fas fa-cart-plus"></i> Add to Cart
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Cart Panel -->
    <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
    <div class="cart-panel" id="cartPanel">
        <div class="cart-header">
            <h3>Shopping Cart</h3>
            <button class="cart-close" onclick="toggleCart()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="cart-items" id="cartItems">
            <!-- Cart items will be dynamically loaded here -->
        </div>
        <div class="cart-summary">
            <div class="cart-total">
                <span>Total: </span>
                <span id="cartTotal">Rs. 0</span>
            </div>
        </div>
        
        <!-- Order Form -->
        <div class="order-form">
            <h4>Delivery Details</h4>
            <form id="checkoutForm">
                <div class="form-group">
                    <input type="text" id="firstName" placeholder="First Name" required>
                </div>
                <div class="form-group">
                    <input type="tel" id="phoneNumber" placeholder="Phone Number" required>
                </div>
                <div class="form-group">
                    <input type="tel" id="secondPhone" placeholder="Second Phone Number (Optional)">
                </div>
                <div class="form-group">
                    <input type="text" id="address" placeholder="Address" required>
                </div>
                <div class="form-group">
                    <input type="text" id="city" placeholder="City" required>
                </div>
                <button type="submit" class="submit-order-btn">
                    <i class="fab fa-whatsapp"></i> Submit Order
                </button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer" id="footer">
        <div class="footer-content">
            <div class="footer-section">
                <h4>Contact Us</h4>
                <p><i class="fas fa-phone"></i> +94 77 123 4567</p>
                <p><i class="fab fa-whatsapp"></i> +94 77 123 4567</p>
                <p><i class="fas fa-envelope"></i> info@techshop.lk</p>
            </div>
            <div class="footer-section">
                <h4>Store Hours</h4>
                <p>Monday - Friday: 9AM - 6PM</p>
                <p>Saturday: 9AM - 4PM</p>
                <p>Sunday: Closed</p>
            </div>
            <div class="footer-section">
                <h4>Follow Us</h4>
                <div class="social-links">
                    <a href="#"><i class="fab fa-facebook"></i></a>
                    <a href="#"><i class="fab fa-instagram"></i></a>
                    <a href="#"><i class="fab fa-whatsapp"></i></a>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2024 Tech Shop. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
